baseMouseSpeed: 400.0
baseScrollSpeed: 20.0

layers:
- name: initial
  bindings:
    tab: tap-hold-next tab ; toggle-layer mouse ; 500
- name: mouse
  # when true, keys that are not mapped keep their original meaning
  passThrough: true
  bindings:
    # quit mouse layer
    q: layer initial
    # keep the mouse layer active
    space: layer mouse
    l: move  1  0
    h: move -1  0
    j: move  0  1
    k: move  0 -1
    p: scroll up
    n: scroll down
    leftalt: speed 4.0
    e: speed 0.3
    capslock: speed 0.1
    f: button left
    d: button middle
    s: button right
